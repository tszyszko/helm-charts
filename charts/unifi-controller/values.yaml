image:
  repository: linuxserver/unifi-network-application
  pullPolicy: IfNotPresent
  tag: 

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# MongoDB configuration for UniFi Network Application
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "8.0"
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    rootUsername: root
    rootPassword: ""  # Set this in your values
    username: unifi
    password: ""      # Set this in your values
    database: unifi
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# UniFi Network Application environment configuration
environment:
  timezone: "Europe/Berlin"
  uid: 1000
  gid: 1000
  memLimit: 1920    # Keep this a little below the resource limits
  memStartup: 1024  # Set this roughly to the resource requests
  # MongoDB connection details (automatically configured if mongodb.enabled is true)
  mongoUser: unifi
  mongoPass: ""     # Set this to match mongodb.auth.password
  mongoHost: ""     # Automatically set to release-name-mongodb if mongodb.enabled is true
  mongoPort: 27017
  mongoDbName: unifi
  mongoAuthSource: admin
  mongoTls: ""      # Set to "true" to enable TLS

service:
  type: "LoadBalancer"
  annotations: {}
    # traefik.ingress.kubernetes.io/service.serversscheme: https
  ports:
    devicecom: 8080
    webapi: 8443
  appDiscovery: false
  syslogCapture: false
  loadBalancerIP: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: unifi.speedport.ip
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - unifi.speedport.ip

# UniFi application data persistence
persistence:
  enabled: true
  accessMode: ReadWriteOnce 
  size: 8Gi 
  ## UniFi data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  storageClass: local-path-retain
  annotations: {}
  backup:
    enabled: true
    accessMode: ReadWriteOnce 
    size: 8Gi 
    ## UniFi backup data Persistent Volume Storage Class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    storageClass: local-path-retain
    annotations: {}

podSecurityContext: {}
  # runAsUser: 999
  # fsGroup: 999

securityContext: {}
#  capabilities:
#     drop:
#     - ALL
#  readOnlyRootFilesystem: false
#  runAsNonRoot: true
#  runAsUser: 999

resources: 
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi

nodeSelector: {}
  #unifi-controller/enabled: "true"          

tolerations: []

affinity: {}
